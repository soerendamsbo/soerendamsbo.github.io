# Outreach: media appearances, op-eds, podcasts and talks. Single source of truth for
# media.qmd (the Outreach page) and the CV. This file is public (served at
# soerendamsbo.github.io/site-data/outreach.yml); the CV repo reads it at build time.
# Sorted by date on the page, so new entries can go anywhere (top is easiest).
#
# Fields
#   id         unique, stable slug: YYYY-MM-DD-<outlet or venue>. Never rename:
#              the CV's selection file refers to it
#   date       YYYY-MM-DD
#   type       interview | op-ed | podcast | radio | reference | talk
#   label      optional display override for the type (e.g. "Live radio interview")
#   title      headline / episode title as published
#   outlet     publication or broadcaster
#   programme  optional show/podcast name within the outlet
#   coauthors  optional, for op-eds
#   url        optional
#   paywalled  true if behind a paywall
#   language   da | en
#   related    optional list of publication ids from publications.yml
#   cv         true to include on the CV (curated subset); to move to the CV repo's
#              selection file, then remove here
#   talks:
#   venue      event / host (instead of outlet)
#   slides     optional link to slides
#   audience   public | policy | practitioner | academic (academic talks are hidden on
#              the Outreach page; all talks live here, conference papers live in the CV)
#   no_slides  true when the talk format had no slides
#   month_only true when only the month is known (date then uses day 01)

