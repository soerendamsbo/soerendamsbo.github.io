# Publications: single source of truth for research.qmd, phd.qmd and the CV.
# This file is public (served at soerendamsbo.github.io/site-data/publications.yml);
# the CV repo reads it at build time. Display order within each type = order in
# this file (newest first).
#
# Fields
#   id          unique, stable slug. Never rename: outreach.yml `related` and the
#               CV's selection files refer to it
#   type        article | chapter | dissertation | working-paper
#   title       English: Title Case (published titles keep the journal's spelling);
#               Danish: sentence case
#   authors     full ordered author list, including me
#   venue       journal (articles) or target journal (working papers)
#   year        publication year
#   volume, issue, pages   citation details (pages = page range or article number)
#   status      published | accepted | rr | under-review | submitted | in-progress
#               CV includes everything except in-progress (website only)
#   doi         DOI without https://doi.org/ prefix
#   url         only when there is no DOI (or a better landing page)
#   open_access true when the published version is freely available
#   finding     one-sentence key finding (research page "Key finding" toggle)
#   figure      path to a web figure (media/figures/<id>.webp); shown only for
#               published work and status accepted
#   figure_label, figure_alt   caption label and screen-reader description
#   abstract    plain text (working papers: R&R and later only)
#   topics      climate | voting | representation (filters on the research page)
#   presented   optional list of conferences (not shown on the website; the CV
#               keeps its own conference list)
#   (which publications get an asterisk on the CV is set in the CV repo's cv-selection.yml)
#   chapters:   book, editors, publisher
#   dissertation: institution
#   PhD articles: in_phd, phd_article (1-4), phd_label (phd.qmd cards)

# ---- Journal articles --------------------------------------------------------

- id: heat-priming-2025
  type: article
  title: "Ineffectiveness of Priming and Contextualizing Personal Weather Experiences: Evidence from a Survey Experiment on Summer Heat"
  finding: "Asking Danes to recall the record-hot summer of 2018 did not raise their support for climate action, and neither did telling them that heat waves are linked to climate change."
  figure: media/figures/heat-priming-2025.webp
  figure_label: "Figure 1"
  figure_alt: "Coefficient plot: effects of recalling the 2018 heat on four climate outcomes, all close to zero"
  authors: ["Søren Damsbo-Svendsen", "Tobias Heide-Jørgensen"]
  venue: Public Opinion Quarterly
  year: 2025
  volume: 89
  issue: 1
  pages: 201-216
  status: published
  topics: [climate, voting]
  doi: 10.1093/poq/nfae067
  open_access: false
  abstract: >-
    We study whether communication that attributes extreme weather to climate change along with individuals’ personal weather experiences can mobilize increased support for climate change action and policies. Using a preregistered representative survey experiment from Denmark, we randomly assign respondents to two treatments: (a) a hot weather prime that asks them to recall the extreme Danish summer of 2018 and (b) contextualizing information that links extreme weather events to climate change. We find that priming past heat experience does not foster increased climate awareness, opinions, or willingness to act or pay. We also fail to find that climate communication strengthens the effect of heat experience on climate attitudes or matters on its own. We argue, and provide tentative evidence, that this is because people in northern regions often recall heat spells as something pleasant rather than perceiving them as a risk. Similar results were obtained using quasi-experimental data on recent local temperature deviations instead of past heat experiences. Overall, the results suggest that what is objectively and meteorologically extreme may subjectively invoke positive feelings and therefore not increase support for climate action. We discuss the implications for climate communication and opinion formation.

- id: flooding-2025
  type: article
  title: "Pro-climate Voting in Response to Local Flooding"
  finding: "After Denmark's 2013 storm surge, flooded districts voted 2–3 percentage points more for pro-climate parties, and in the hardest-hit districts pro-climate local candidates gained votes too."
  figure: media/figures/flooding-2025.webp
  figure_label: "Figure 2"
  figure_alt: "Line chart, 1998 to 2019: pro-climate party vote share in flooded and control districts, diverging after the 2013 storm surge"
  authors: ["Søren Damsbo-Svendsen"]
  venue: Political Behavior
  year: 2025 # print issue; online first 2024-11-04
  volume: 47
  issue: 3
  pages: 1169-1190
  status: published
  topics: [climate, voting]
  in_phd: true
  phd_article: 3
  phd_label: Flooding
  doi: 10.1007/s11109-024-09984-0
  open_access: true
  abstract: >-
    Human-caused global warming exacerbates extreme weather events, but evidence of their impact on political behavior is limited. This article presents a twofold study of the effects of severe storm surge flooding on pro-climate voting in Danish elections. Using difference-in-differences research designs and administrative data, the article shows how the electoral effects of local flooding depends on the intensity of the experience. Voting for pro-climate parties in Danish national elections increased by around 2-3 percentage points in polling districts with flooding. Voting for local election candidates, who communicate a priority for climate issues and can have substantial influence on municipal climate policy, also increased four years after the flood, however only in districts with extreme flooding. Severe flooding increased the relative election chances of marginal pro-climate candidates by around five percentage points. Responsiveness to local flooding depends on the local extremity of the event and, possibly, local citizens’ pre-existing climate awareness. The ostensibly modest effects are illustrative of electoral decision-making, even if the practical political and environmental implications are limited. By raising the salience of climate issues, personal flooding experience shapes voting behavior in a changing climate.

- id: polycrisis-2024
  type: article
  title: "Anxious But Hesitant to Act: The Impact of Concurrent Priming of the Climate Crisis and the War in Ukraine on Public Support"
  finding: "Thinking about climate change and the war in Ukraine at the same time made Danes more worried, especially about climate, but less willing to pay for action, especially on Ukraine."
  figure: media/figures/polycrisis-2024.webp
  figure_label: "Figure 2"
  figure_alt: "Bar and coefficient charts: attitudes and priming effects for climate and Ukraine on willingness to pay, crisis perception and willingness to act"
  authors: ["Jakob Dreyer", "Søren Damsbo-Svendsen"] # order per Crossref
  venue: International Journal of Public Opinion Research
  year: 2024
  volume: 36
  issue: 4
  pages: edae054
  status: published
  topics: [climate, voting]
  doi: 10.1093/ijpor/edae054
  open_access: false
  abstract: >-
    Decision-makers and commentators are calling Europe’s present political predicament a polycrisis: a period of overlapping, urgent, and mutually reinforcing crises with climate change and Russia’s invasion of Ukraine as key challenges. Our knowledge about how citizens perceive and respond to polycrisis is limited. This paper presents a preregistered survey experiment from Denmark with 4,017 nationally representative respondents. We study crisis perceptions and willingness to act for the climate and Ukraine after concurrently priming both issues. Overall, threat perceptions increase but so does inaction. Climate change drives increases in threat perception and worry, while the war in Ukraine drives a reduction in willingness to act and pay. The results challenge the ‘finite pool of worry’ hypothesis, which presupposes that worry about new, urgent threats will crowd out worry about existing problems, especially in case of climate change. Rather willingness to act under polycrisis is issue-specific and shaped by concrete pocketbook costs, as our experimental evidence illustrates. The results also have important policy implications at a time when decision-makers frequently justify political action through polycrisis discourse.

- id: rain-turnout-2023
  type: article
  title: "When the Election Rains Out and How Bad Weather Excludes Marginal Voters From Turning Out"
  finding: "In Danish local elections, each centimeter of rain on Election Day lowers turnout by about one percentage point on average, and by up to six times as much among young, inexperienced voters."
  figure: media/figures/rain-turnout-2023.webp
  figure_label: "Figure 4 (rainfall panel)"
  figure_alt: "Marginal effect of rainfall on turnout by election cohort, most negative for young voters in their second and third elections"
  authors: ["Søren Damsbo-Svendsen", "Kasper M. Hansen"]
  venue: Electoral Studies
  year: 2023
  volume: 81
  pages: "102573"
  status: published
  topics: [climate, voting]
  in_phd: true
  phd_article: 4
  phd_label: Turnout
  doi: 10.1016/j.electstud.2022.102573
  open_access: true
  abstract: >-
    Ostensibly random and trivial experiences of everyday life, e.g., local weather, can have significant political consequences. First, we present a comprehensive meta-analysis of 34 studies of electoral turnout and rainfall – the vast majority demonstrating a negative association. Secondly, we present a new analysis of a voter panel with validated turnout for a complete electorate merged with fine-grained meteorological observations to show that Election Day rainfall reduces turnout by 0.95 percentage points per centimeter, while more sunshine increases turnout. Marginal voters (young voters) are up to six times more susceptible to bad weather and respond more positively to pleasant weather. Thus, bad weather exacerbates unequal democratic participation by pushing low-propensity voters to abstain. Efforts to include marginal voters therefore ought to be intensified during poor weather, and elections could even be moved to seasons with more pleasant weather to improve participatory equality.

- id: media-salience-2022
  type: article
  title: "Mass Media Influence on the Rapid Rise of Climate Change"
  finding: "In Denmark in 2019, rising climate coverage in the news was followed by more people naming climate the most important problem, and not the other way around."
  figure: media/figures/media-salience-2022.webp
  figure_label: "Figure 1"
  figure_alt: "Time series, January to June 2019: public salience of climate change rising alongside spikes in media coverage"
  authors: ["Søren Damsbo-Svendsen"]
  venue: International Journal of Public Opinion Research
  year: 2022
  volume: 34
  issue: 2
  pages: edac009
  status: published
  topics: [climate, voting]
  in_phd: true
  phd_article: 1
  phd_label: Media
  doi: 10.1093/ijpor/edac009 # was swapped with local-warming-2021 on the old page
  open_access: false
  abstract: >-
    When a political issue rises to the top of the public agenda, it puts pressure on decisionmakers, shifts power to actors engaging with the issue, and opens a window of opportunity. This article shows that online mass media contributed to the rapid rise of climate change on European public agendas in and around 2019. It also suggests that issue publics, i.e., particularly concerned and interested citizens, were influenced most. Conversely, citizens without strong climate opinions are not subject to influence from intensive media coverage. The results come from vector autoregression (VAR) models that take advantage of unique daily salience time series. The time series are constructed from weekly repeated nationally representative surveys of the public (N=25,445) and online news articles (N=6,905) by a dominant mass media news outlet that boasts a particularly large, trustful, and diverse audience. Traditional mass media can retain a powerful agenda-setting role even in increasingly fragmented media environments. But the target of their influence depends on the issue and the composition of corresponding issue publics, plausibly due in part to individual differences in use and processing of information about the issue.

- id: local-warming-2021
  type: article
  title: "How Weather Experiences Strengthen Climate Opinions in Europe"
  finding: "Across 12 European countries, people interviewed in unusually warm weather held slightly stronger climate opinions: about one point on a 100-point scale for a week 5°C warmer than normal."
  figure: media/figures/local-warming-2021.webp
  figure_label: "Additional analysis"
  figure_alt: "Predicted climate opinion index rising slightly with warmer-than-normal weeks, across four models"
  authors: ["Søren Damsbo-Svendsen"]
  venue: West European Politics
  year: 2021
  volume: 44
  issue: 7
  pages: 1604-1618
  status: published
  topics: [climate, voting]
  in_phd: true
  phd_article: 2
  phd_label: Temperature
  doi: 10.1080/01402382.2020.1792731 # was swapped with media-salience-2022 on the old page
  open_access: false
  abstract: >-
    Previous research has shown that we believe more in the reality of climate change when we experience warmer-than-usual temperatures. This reflects a psychological process in which easily accessible information from personal weather experiences is used as a heuristic to form climate opinions. This paper replicates and extends upon a research design and results of Egan and Mullin to provide the first systematic European study of the Local Warming Effect. Based on data from 12 European countries, the analysis shows that when objective temperatures increase by two standard deviations (5°C) relative to normal temperatures, climate opinions are strengthened by around 0.5–1.0 percentage points – comparable to the effect of a full step to the left on a 0–10 political ideology scale.

