- id: harassment-awareness
  type: working-paper
  title: "Raising Awareness of Harassment Against Politicians: Experimental Evidence of Disengagement Among Aspiring Candidates"
  finding: "Stories of harassment against politicians did not put the average citizen off running for office, but made citizens already considering it about four percentage points less willing."
  abstract: "The risk of harassment comes with the job for political officeholders and candidates, but raising awareness about it can harm the political engagement of citizens and aspiring candidates. Using a preregistered survey experiment in Denmark, replicated in Germany, the UK, and France (n = 8,899), we raise awareness about political harassment by presenting 55 true harassment stories from local politicians. Contrary to existing studies, we find negative conditional effects of around four percentage points on citizens who had expressed consideration of a political career, whereas the average citizen is undeterred from engaging in politics by the threat of harassment. We argue that the distinction between ordinary citizens and aspirants is crucial because personal relevance shapes aspirants' information processing related to costs and benefits of politics. Citizens' attitudinal responses to awareness of harassment are mostly normatively desirable, but the impact on potential candidates has negative implications for recruitment and democratic representation."
  figure: media/figures/harassment-awareness.webp
  figure_label: "Figure 3"
  figure_alt: "Conditional treatment effects on willingness to run for office, turning negative among likely candidates"
  authors: ["Søren Damsbo-Svendsen", "Karina Kosiara-Pedersen"]
  status: rr
  topics: [representation]
  venue: British Journal of Political Science
  presented: ["EPSA 2025, Madrid", "ECPR General Conference 2025, Thessaloniki"]

- id: young-naive
  type: working-paper
  title: "“Young and Naïve”: How Ageism and Sexism Shape Harassment Against Young Candidates and Representatives"
  finding: "Younger Danish politicians report more harassment than older ones, and the gap between women and men is widest among the youngest, especially for sexual harassment."
  abstract: "Harassment, intimidation, and violence in politics fall disproportionately on women, but whether they also fall on the young, and how gender intersects with age, is rarely examined. Treating age as a key dimension of exposure, this article uses a two-by-two typology of physical and psychological, sexual and nonsexual harassment and combines 23 interviews with young representatives and three elite surveys of Danish candidates and officeholders at the national and local levels (n = 5,395). Younger politicians report more harassment than their older colleagues across all four types of harassment. Both young men and young women are dismissed as inexperienced, but for young women the dismissal is often sexualised, involving comments on their bodies, rape threats, and reproductive harassment. The gender gap is widest among the youngest, especially in sexual harassment, and is absent in nonsexual physical harassment. We argue that ageism and sexism are related mechanisms that police who is entitled to political standing. For young women, their age and gender are mutually reinforcing. By discouraging young people, and young women especially, from entering or remaining in politics, harassment narrows political recruitment precisely where it is already narrowest and inhibits representation."
  figure: media/figures/young-naive.webp
  figure_label: "Appendix figure"
  figure_alt: "Predicted share reporting harassment by age, higher for young women than young men, converging with age"
  authors: ["Karina Kosiara-Pedersen", "Christina Fiig", "Søren Damsbo-Svendsen"] # order per CV
  status: rr
  topics: [representation]
  venue: European Journal of Political Research

